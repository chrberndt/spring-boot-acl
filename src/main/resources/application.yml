#logging:
#  level:
#    ROOT: debug
spring:
  application:
    name: spring-boot-acl
#  datasource: obtained from application.yml
  # TODO: the following workaround is only required for h2
  # and should apply only for testing
  # (see: https://stackoverflow.com/questions/73067624/function-identity-not-found-when-inserting-audited-revision-using-hibernate-en)
  datasource:
    url: jdbc:h2:mem:test;MODE=LEGACY;
  jpa:
    hibernate:
      # CAUTION: any data entered will be dropped when the application is started
      ddl-auto: create
  sql:
    init:
      # Force schema creation for non-embedded database
      mode: always